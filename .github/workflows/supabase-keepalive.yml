name: Keep Supabase awake

# Free-tier Supabase projects pause after ~7 days of inactivity, which takes
# accounts and cloud backup offline. This pings the database every 3 days.
#
# GitHub also disables scheduled workflows after 60 days without repository
# activity, so each run re-enables this workflow through the API, which keeps
# the schedule alive without dummy commits.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://jezkyqgjmxshiijxhrbo.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o response.txt -w '%{http_code}' -X POST \
              -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}' \
              "$SUPABASE_URL/rest/v1/rpc/keepalive")
            if [ "$status" = "200" ]; then
              echo "Supabase is awake: $(cat response.txt)"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $status"
            sleep 20
          done
          echo "::error::Supabase did not respond. It may be paused; restore it in the dashboard."
          exit 1

      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
